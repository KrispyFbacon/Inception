# NGINX connection settings.
events {
	# Maximum simultaneous connections per worker.
	worker_connections 1024;
}


# HTTP/HTTPS configuration.
http {

	# Map file extensions to their Content-Type.
	include /etc/nginx/mime.types;

    # Default MIME type for files whose type NGINX cannot determine.
	default_type application/octet-stream;


	# Website configuration.
	server {

		# Listen for HTTPS connections on port 443.
        # 'ssl' enables TLS encryption for these connections.
        # Also listen for IPv6 HTTPS connections on port 443.
		listen 443 ssl;
		listen [::]:443 ssl;


		# Our domain.
		# This matches the DOMAIN_NAME in our .env file 
		# and the domain used when generating our certificate.
		server_name frbranda.42.fr;


		# Path to our self-signed SSL/TLS certificate and private key.
		ssl_certificate /etc/nginx/ssl/inception.crt;
		ssl_certificate_key /etc/nginx/ssl/inception.key;


		# Only allow modern and secure TLS versions (TLS 1.2/1.3).
		ssl_protocols TLSv1.2 TLSv1.3;


		# WordPress files.
		root /var/www/wordpress;

		# Default files NGINX looks for when a directory is requested.
		# index.php is important because WordPress is mainly PHP.
		index index.php index.html;


		location / {
			# Try to serve the requested file or directory.
    		# If neither exists, let WordPress handle the request through index.php.
			try_files $uri $uri/ /index.php?$args;
		}


		# Match requests for PHP files.
		# NGINX does NOT execute PHP itself. It forwards PHP requests to PHP-FPM.
		location ~ \.php$ {

			# Load Debian's standard FastCGI configuration.
			# This provides parameters needed to pass the PHP request correctly to PHP-FPM.
			include snippets/fastcgi-php.conf;

			# Send PHP requests to the WordPress container on PHP-FPM's port 9000.
			# 'wordpress' is the Docker Compose service name.
			fastcgi_pass wordpress:9000;
		}
	}
}